version: "3.9"

services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8080"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: dcms
      DB_USERNAME: dcms
      DB_PASSWORD: dcms

      # Media optimization (async)
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

      # Used by Sanctum when needed.
      SANCTUM_STATEFUL_DOMAINS: "localhost,localhost:3000"

      # Set to "1" if you want migrations to run automatically.
      MIGRATE_ON_START: "0"
    depends_on:
      - db
      - redis
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache

  # Separate queue worker so media optimization doesn't slow down web requests.
  # If you need more throughput, scale this service to multiple replicas.
  queue-worker:
    build: .
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8080"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: dcms
      DB_USERNAME: dcms
      DB_PASSWORD: dcms

      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

      # Don't run migrations inside worker.
      MIGRATE_ON_START: "0"
    depends_on:
      - db
      - redis
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    command: ["php", "artisan", "queue:work", "--queue=media-optimization", "--sleep=3", "--tries=3", "--timeout=300", "--max-time=0"]

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: dcms
      MYSQL_USER: dcms
      MYSQL_PASSWORD: dcms
      MYSQL_ROOT_PASSWORD: dcms_root
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
  
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  db-data:

